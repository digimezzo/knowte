<div class="window-frame">
  <div class="window-frame-titlebar">
    <div class="window-frame-titlebar-dragarea"></div>
    @if (!appearance.windowHasNativeTitleBar) {
      <app-window-controls></app-window-controls>
    }
  </div>
  <div class="window-frame-content">
    <div class="welcome">
      <app-logo-full></app-logo-full>
      <div class="welcome-title mt-4">{{ 'WelcomePage.Title' | translate }}</div>
      <div class="welcome-text mt-4">{{ 'WelcomePage.Text' | translate }}</div>
      <div class="mt-4">
        @if (!isBusy) {
          <app-accent-button class="mt-2" (click)="openDirectoryChooserAsync()">
            {{ 'SettingsPage.SelectButton' | translate }}
          </app-accent-button>
        }
        @if (isBusy) {
          <mat-spinner [diameter]="40"></mat-spinner>
        }
      </div>
    </div>
  </div>
</div>

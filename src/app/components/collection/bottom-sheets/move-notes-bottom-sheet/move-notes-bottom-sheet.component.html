<div class="d-flex flex-column">
  @for (collection of this.collections; track collection) {
    <div>
      <span class="move-collection-item pointer p-1" (click)="moveNotesToCollectionAsync(collection)">
        <i class="move-collection-icon las la-box" [ngClass]="{ isActive: collection === activeCollection }"> </i>
        <span>{{ collection }}</span>
      </span>
    </div>
  }
</div>

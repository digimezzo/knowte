<div>
  {{ 'SettingsPage.TextSizeInNotes' | translate }}:
  <mat-form-field class="font-size-selector mx-1">
    <mat-select [(ngModel)]="selectedNoteZoomPercentage">
      @for (noteZoomPercentage of noteZoomPercentages; track noteZoomPercentage) {
        <mat-option [value]="noteZoomPercentage">
          {{ noteZoomPercentage }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
  %
</div>

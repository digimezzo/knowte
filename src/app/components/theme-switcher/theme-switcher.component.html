<div class="theme-switcher-component">
  @for (theme of appearanceService.themes; track theme) {
    <div
      matTooltip="{{ !theme.isBroken ? theme.name : theme.name + ' (' + ('broken' | translate) + ')' }}"
      >
      <div class="theme-switcher-component-button mr-2 mb-2" [ngClass]="{ inactive: theme.isBroken }" (click)="setTheme(theme)">
        @if (theme.name === appearanceService.selectedTheme.name) {
          <i
            class="theme-switcher-component-button__selector las la-check"
          ></i>
        }
        @if (theme.isBroken) {
          <i class="theme-switcher-component-button__selector las la-times"></i>
        }
        <div class="theme-switcher-component-button__color">
          <div
            class="theme-switcher-component-button__accent"
                    [ngStyle]="{
                        background:
                            'linear-gradient(45deg, ' + theme.coreColors.primaryColor + ' 30%, ' + theme.coreColors.secondaryColor + ' 100%)'
                    }"
          ></div>
          <div
            class="theme-switcher-component-button__light"
            [ngStyle]="{ background: theme.lightColors.background }"
          ></div>
          <div
            class="theme-switcher-component-button__dark"
            [ngStyle]="{ background: theme.darkColors.background }"
          ></div>
        </div>
      </div>
    </div>
  }
</div>

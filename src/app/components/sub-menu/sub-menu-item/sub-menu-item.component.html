<div class="sub-menu-item no-select" matRipple>
  <div #labelContainer class="sub-menu-item__label-container">
    <span class="sub-menu-item__label" [ngClass]="{ 'sub-menu-item__label--selected': this.page === this.selectedPage }">{{
      text
    }}</span>
    <span #labelMeasure class="sub-menu-item__label-measure">{{ text }}</span>
  </div>

  @if (count > -1) {
    <div class="sub-menu__count-label"><span #countText>{{ count }}</span></div>
  }
</div>
